<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<title>二游日历</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="hd">
			<div class="hd-line">
				<h1 class="title">二游日历</h1>
				<button id="refresh" class="icon-btn" type="button" title="刷新" aria-label="刷新">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" />
						<polyline points="21 3 21 8 16 8" />
					</svg>
				</button>
				<button id="settings" class="icon-btn" type="button" title="设置" aria-label="设置">
					<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="8" cy="8" r="2.1" />
						<path d="M12.7 9.6a1.1 1.1 0 0 0 .22 1.21l.04.04a1.34 1.34 0 1 1-1.9 1.9l-.04-.04a1.1 1.1 0 0 0-1.21-.22 1.1 1.1 0 0 0-.67 1v.11a1.34 1.34 0 1 1-2.68 0v-.06a1.1 1.1 0 0 0-.72-1 1.1 1.1 0 0 0-1.21.22l-.04.04a1.34 1.34 0 1 1-1.9-1.9l.04-.04a1.1 1.1 0 0 0 .22-1.21 1.1 1.1 0 0 0-1-.67h-.11a1.34 1.34 0 1 1 0-2.68h.06a1.1 1.1 0 0 0 1-.72 1.1 1.1 0 0 0-.22-1.21l-.04-.04a1.34 1.34 0 1 1 1.9-1.9l.04.04a1.1 1.1 0 0 0 1.21.22h.05a1.1 1.1 0 0 0 .67-1v-.11a1.34 1.34 0 1 1 2.68 0v.06a1.1 1.1 0 0 0 .67 1 1.1 1.1 0 0 0 1.21-.22l.04-.04a1.34 1.34 0 1 1 1.9 1.9l-.04.04a1.1 1.1 0 0 0-.22 1.21v.05a1.1 1.1 0 0 0 1 .67h.11a1.34 1.34 0 1 1 0 2.68h-.06a1.1 1.1 0 0 0-1 .67z" />
					</svg>
				</button>
			</div>
			<div class="meta">
				<span id="status">载入中…</span>
				<span id="scrape" class="scrape" hidden></span>
			</div>
		</header>

		<main id="list" class="list" aria-live="polite">
			<p class="empty">正在读取数据…</p>
		</main>

		<footer class="ft">
			<span id="refreshed">—</span>
			<span class="ft-hint">悬停查看池名与时间明细</span>
		</footer>

		<script type="module" src="popup.js"></script>
	</body>
</html>
