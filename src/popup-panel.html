<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>二游日历 · 日程</title>
		<link rel="stylesheet" href="schedule.css" />
		<style>
			:root {
				color-scheme: light dark;
			}
			/* 浏览器 action popup 的硬上限是 800×600；这里按设计宽度 520 × 满高 600 使用。
			   高度必须**固定**：面板根是 flex 列（头部/滚动层/底栏），只有父级有界时
			   .gacha-cal-sched-body 才会内部滚动、底栏才能常驻在底部。 */
			html,
			body {
				margin: 0;
				padding: 0;
				width: 520px;
				height: 600px;
				overflow: hidden;
			}
			body {
				background: #f2f3f5;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI",
					"Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #101013;
				}
			}
			/* 插件里 .gacha-cal-pop 是侧栏浮层（fixed + 690px + 阴影 + 限高滚动）。
			   popup 里它是填满窗口的容器：取消定位/阴影，固定 520×600，滚动交给内部滚动层。 */
			#root.gacha-cal-pop {
				position: static;
				width: 520px;
				height: 600px;
				max-height: 600px;
				overflow: hidden;
				background: transparent;
				border: none;
				box-shadow: none;
				padding: 0;
				z-index: auto;
			}
		</style>
	</head>
	<body class="popup-host">
		<div id="root" class="gacha-cal-pop gacha-cal-pop--sched"></div>
		<script type="module" src="panel.js"></script>
	</body>
</html>
